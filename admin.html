<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAVEN - Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        /* ================= HEADER ================= */

        header {
            background: #000;
            color: #fff;

            padding: 22px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        header h1 {
            font-size: 28px;
        }

        header span {
            color: #ccc;
            font-size: 14px;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 100%;
            max-width: 1200px;

            margin: 35px auto;

            padding: 0 20px;
        }

        /* ================= DASHBOARD ================= */

        .dashboard {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .dashboard-card {
            background: #fff;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .dashboard-card h3 {
            font-size: 16px;

            color: #666;

            margin-bottom: 10px;
        }

        .dashboard-card strong {
            font-size: 30px;
        }

        /* ================= SECTION ================= */

        .section {
            background: #fff;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;

            font-size: 24px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;

            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        /* ================= BUTTON ================= */

        button {
            border: none;

            cursor: pointer;

            border-radius: 7px;

            font-weight: bold;
        }

        .add-button {
            background: #000;

            color: #fff;

            padding: 14px 25px;

            margin-top: 18px;

            font-size: 16px;
        }

        .add-button:hover {
            background: #333;
        }

        /* ================= PRODUCTS ================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;

            border-radius: 10px;

            overflow: hidden;

            background: #fff;
        }

        .product-card img {
            width: 100%;

            height: 230px;

            object-fit: contain;

            background: #f5f5f5;

            display: block;
        }

        .product-details {
            padding: 18px;
        }

        .product-details h3 {
            margin-bottom: 8px;
        }

        .product-details .price {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 12px;
        }

        .product-details p {
            color: #666;

            font-size: 14px;

            margin-bottom: 5px;
        }

        /* ================= ACTIONS ================= */

        .actions {
            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .edit-button {
            background: #eee;

            padding: 10px 15px;
        }

        .delete-button {
            background: #000;

            color: #fff;

            padding: 10px 15px;
        }

        .edit-button:hover {
            background: #ddd;
        }

        .delete-button:hover {
            background: #333;
        }

        /* ================= ORDERS ================= */

        .order {
            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 15px;
        }

        .order h3 {
            margin-bottom: 10px;
        }

        .order p {
            margin: 5px 0;

            color: #555;
        }

        .order-status {
            display: inline-block;

            background: #eee;

            padding: 7px 12px;

            border-radius: 20px;

            margin-top: 10px;

            font-size: 13px;

            font-weight: bold;
        }

        /* ================= MOBILE ================= */

        @media screen and (max-width: 800px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 22px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .products {
                grid-template-columns: 1fr;
            }

        }

        @media screen and (max-width: 500px) {

            .container {
                padding: 0 12px;

                margin-top: 20px;
            }

            .section {
                padding: 18px;
            }

            header {
                flex-direction: column;

                text-align: center;
            }

        }
    </style>
</head>

<body>


<!-- ================= HEADER ================= -->

<header>

    <div>
        <h1>ZAVEN ADMIN PANEL</h1>
        <span>Wear Different</span>
    </div>

    <button
        onclick="goToStore()"
        style="
            background:white;
            color:black;
            padding:12px 18px;
        "
    >
        🛍️ View Store
    </button>

</header>


<!-- ================= MAIN ================= -->

<div class="container">


    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard">

        <div class="dashboard-card">

            <h3>Total Products</h3>

            <strong id="totalProducts">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            <h3>Total Orders</h3>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            <h3>Store Status</h3>

            <strong>
                ON
            </strong>

        </div>

    </div>


    <!-- ================= ADD PRODUCT ================= -->

    <div class="section">

        <h2>
            ➕ Add Product
        </h2>


        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: ZAVEN Premium T-Shirt"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="2499"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Image File
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="shirt-new.jpg"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="productCategory">

                        <option>
                            T-Shirt
                        </option>

                        <option>
                            Shirt
                        </option>

                        <option>
                            Hoodie
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Product description..."
                    ></textarea>

                </div>

            </div>


            <button
                type="submit"
                class="add-button"
            >
                ➕ Add Product
            </button>

        </form>

    </div>


    <!-- ================= PRODUCTS ================= -->

    <div class="section">

        <h2>
            📦 Products
        </h2>

        <div
            class="products"
            id="productsContainer"
        ></div>

    </div>


    <!-- ================= ORDERS ================= -->

    <div class="section">

        <h2>
            🛒 Orders
        </h2>

        <div id="ordersContainer">

            <div class="order">

                <h3>
                    No orders yet
                </h3>

                <p>
                    WhatsApp se aane wale orders
                    baad mein yahan manage kiye ja sakte hain.
                </p>

                <span class="order-status">
                    Waiting for orders
                </span>

            </div>

        </div>

    </div>

</div>


<script>

/* ================= DEFAULT PRODUCTS ================= */

let products = [

    {
        name: "Premium T-Shirt",
        price: 2499,
        image: "shirt-new.jpg",
        category: "T-Shirt",
        description:
            "Premium quality T-shirt."
    },

    {
        name: "ZAVEN T-Shirt",
        price: 1999,
        image: "shirt5.jpg",
        category: "T-Shirt",
        description:
            "Clean, comfortable and stylish."
    },

    {
        name: "ZAVEN T-Shirt 3",
        price: 2199,
        image: "shirt6.jpg",
        category: "T-Shirt",
        description:
            "Stylish and comfortable."
    },

    {
        name: "ZAVEN Signature T-Shirt",
        price: 2299,
        image: "shirt4.jpg",
        category: "T-Shirt",
        description:
            "Premium ZAVEN design."
    }

];


/* ================= LOAD PRODUCTS ================= */

function loadProducts() {

    const container =
        document.getElementById(
            "productsContainer"
        );

    container.innerHTML = "";


    products.forEach(
        function(product, index) {

            container.innerHTML += `

                <div class="product-card">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="product-details">

                        <h3>
                            ${product.name}
                        </h3>

                        <div class="price">
                            Rs.
                            ${Number(product.price).toLocaleString()}
                        </div>

                        <p>
                            Category:
                            ${product.category}
                        </p>

                        <p>
                            ${product.description}
                        </p>

                        <div class="actions">

                            <button
                                class="edit-button"
                                onclick="editProduct(${index})"
                            >
                                ✏️ Edit
                            </button>

                            <button
                                class="delete-button"
                                onclick="deleteProduct(${index})"
                            >
                                🗑️ Delete
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    document.getElementById(
        "totalProducts"
    ).innerText = products.length;

}


/* ================= ADD PRODUCT ================= */

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "productName"
                ).value;

            const price =
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                );

            const image =
                document.getElementById(
                    "productImage"
                ).value;

            const category =
                document.getElementById(
                    "productCategory"
                ).value;

            const description =
                document.getElementById(
                    "productDescription"
                ).value;


            products.push({

                name: name,

                price: price,

                image: image,

                category: category,

                description: description

            });


            loadProducts();


            document
                .getElementById("productForm")
                .reset();


            alert(
                "Product added successfully!"
            );

        }
    );


/* ================= DELETE PRODUCT ================= */

function deleteProduct(index) {

    const confirmDelete =
        confirm(
            "Kya aap is product ko delete karna chahte hain?"
        );


    if (!confirmDelete) {
        return;
    }


    products.splice(
        index,
        1
    );


    loadProducts();

}


/* ================= EDIT PRODUCT ================= */

function editProduct(index) {

    const product =
        products[index];


    const newName =
        prompt(
            "Product name:",
            product.name
        );


    if (newName === null) {
        return;
    }


    const newPrice =
        prompt(
            "Product price:",
            product.price
        );


    if (newPrice === null) {
        return;
    }


    const newImage =
        prompt(
            "Image file:",
            product.image
        );


    if (newImage === null) {
        return;
    }


    product.name =
        newName;

    product.price =
        Number(newPrice);

    product.image =
        newImage;


    loadProducts();


    alert(
        "Product updated successfully!"
    );

}


/* ================= STORE ================= */

function goToStore() {

    window.location.href =
        "index.html";

}


/* ================= START ================= */

loadProducts();

</script>

</body>
</html>
